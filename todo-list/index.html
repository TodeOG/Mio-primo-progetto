<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">
    <h1>La mia To-Do List</h1>

    <div class="input-area">
      <input type="text" id="input-attivita" placeholder="Scrivi una nuova attività...">
      <button id="btn-aggiungi">Aggiungi</button>
    </div>

    <div class="filtri">
      <button class="btn-filtro" data-filtro="tutte">Tutte</button>
      <button class="btn-filtro" data-filtro="attive">Attive</button>
      <button class="btn-filtro" data-filtro="completate">Completate</button>
    </div>

    <ul id="lista-attivita">
      <!-- qui appariranno le attività, generate da JavaScript -->
    </ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
